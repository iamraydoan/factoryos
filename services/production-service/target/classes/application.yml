server:
  port: 8082

spring:
  application:
    name: production-service
  datasource:
    url: jdbc:postgresql://localhost:5432/factoryos
    username: factoryos
    password: factoryos_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  server:
    port: 9090

kafka:
  bootstrap-servers: localhost:9092
