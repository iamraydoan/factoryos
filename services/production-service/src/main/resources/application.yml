server:
  port: ${SERVER_PORT:3001}

spring:
  application:
    name: production-service
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:4001}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/factoryos
    username: ${DB_USER:factoryos}
    password: ${DB_PASSWORD:factoryos_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
