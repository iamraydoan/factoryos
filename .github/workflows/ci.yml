name: FactoryOS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Build, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Install Protobuf Go Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Protobuf Code
        run: make proto-gen

      - name: Verify Go Workspace Build
        run: |
          go build -o /dev/null ./platform/edge-runtime/...
          go build -o /dev/null ./platform/platform-sdk/...
          go build -o /dev/null ./services/analytics-engine/...
          go build -o /dev/null ./services/ingestion-service/...
          go build -o /dev/null ./services/resource-service/...
          go build -o /dev/null ./examples/mock-plc-simulator/...

      - name: Run Unit Tests & Generate Coverage Report
        run: |
          echo "========================================="
          echo "[TEST] platform/edge-runtime"
          echo "========================================="
          cd platform/edge-runtime
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          cd "$GITHUB_WORKSPACE"

          echo "========================================="
          echo "[TEST] services/analytics-engine"
          echo "========================================="
          cd services/analytics-engine
          go test -race -coverprofile=coverage.out ./processor/... ./db/... ./consumer/... ./config/...
          go tool cover -func=coverage.out
          cd "$GITHUB_WORKSPACE"

          echo "========================================="
          echo "[TEST] services/ingestion-service"
          echo "========================================="
          cd services/ingestion-service
          go test -race -coverprofile=coverage.out ./server/...
          go tool cover -func=coverage.out
          cd "$GITHUB_WORKSPACE"

          echo "========================================="
          echo "[TEST] services/resource-service"
          echo "========================================="
          cd services/resource-service
          go test -race -coverprofile=coverage.out ./config/... ./server/...
          go tool cover -func=coverage.out
          cd "$GITHUB_WORKSPACE"

      - name: Enforce Code Coverage Threshold (> 80%)
        run: |
          FAILED=false
          MIN_COVERAGE=80.0

          check_coverage() {
            local module=$1
            local dir=$2
            cd "$dir"
            COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
            echo "-----------------------------------------"
            echo "$module: ${COVERAGE}%"

            IS_BELOW=$(awk -v cov="$COVERAGE" -v min="$MIN_COVERAGE" 'BEGIN {print (cov < min)}')
            if [ "$IS_BELOW" -eq 1 ]; then
              echo "❌ FAIL: ${COVERAGE}% is below ${MIN_COVERAGE}% threshold"
              FAILED=true
            else
              echo "✅ PASS: ${COVERAGE}% meets ${MIN_COVERAGE}% threshold"
            fi
            cd "$GITHUB_WORKSPACE"
          }

          check_coverage "platform/edge-runtime" "platform/edge-runtime"
          check_coverage "services/analytics-engine" "services/analytics-engine"
          check_coverage "services/ingestion-service" "services/ingestion-service"
          check_coverage "services/resource-service" "services/resource-service"

          if [ "$FAILED" = true ]; then
            echo ""
            echo "❌ One or more modules failed coverage threshold!"
            exit 1
          else
            echo ""
            echo "✅ All modules pass coverage threshold!"
          fi
