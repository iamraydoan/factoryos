openapi: 3.0.3
info:
  title: FactoryOS Telemetry & Analytics Query API
  description: |
    Target-state REST contract for querying real-time equipment telemetry,
    aggregate history, threshold alerts, and service health. Authentication
    and authorization are defined centrally by the FactoryOS REST standard.
  version: 1.0.0
  contact:
    name: FactoryOS Architecture Team
    url: https://github.com/iamraydoan/factoryos
  license:
    name: FactoryOS Proprietary License
    url: https://github.com/iamraydoan/factoryos/blob/main/LICENSE

externalDocs:
  description: FactoryOS API governance documentation
  url: https://github.com/iamraydoan/factoryos/tree/main/docs/07-api

servers:
  - url: http://localhost/api/v1
    description: Local Traefik API gateway

tags:
  - name: Telemetry
    description: Real-time equipment telemetry queries
  - name: Analytics
    description: Historical and aggregated telemetry analytics
  - name: Alerts
    description: Active telemetry threshold alerts
  - name: Observability
    description: Liveness, readiness, and protected service statistics

security:
  - zitadel: []

paths:
  /healthz:
    $ref: './paths/healthz.yaml'
  /ready:
    $ref: './paths/ready.yaml'
  /stats:
    $ref: './paths/stats.yaml'
  /telemetry/latest:
    $ref: './paths/latest.yaml'
  /telemetry/history:
    $ref: './paths/history.yaml'
  /telemetry/alerts:
    $ref: './paths/alerts.yaml'

components:
  securitySchemes:
    zitadel:
      $ref: '../../common/v1/security/oidc.yaml#/components/securitySchemes/zitadel'

  responses:
    BadRequestError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/BadRequestError'
    UnauthorizedError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/UnauthorizedError'
    ForbiddenError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/ForbiddenError'
    NotFoundError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/NotFoundError'
    TooManyRequestsError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/TooManyRequestsError'
    InternalServerError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/InternalServerError'
    ServiceUnavailableError:
      $ref: '../../common/v1/responses/errors.yaml#/components/responses/ServiceUnavailableError'

  schemas:
    HealthStatusResponse:
      $ref: '../../common/v1/schemas/health.yaml#/components/schemas/HealthStatusResponse'
    ReadinessResponse:
      $ref: '../../common/v1/schemas/health.yaml#/components/schemas/ReadinessResponse'
    ServiceStatsResponse:
      $ref: './schemas/stats.yaml#/components/schemas/ServiceStatsResponse'
    SensorQuality:
      $ref: './schemas/telemetry.yaml#/components/schemas/SensorQuality'
    TelemetryReading:
      $ref: './schemas/telemetry.yaml#/components/schemas/TelemetryReading'
    TelemetryAggregateBucket:
      $ref: './schemas/aggregate.yaml#/components/schemas/TelemetryAggregateBucket'
    ActiveAlert:
      $ref: './schemas/alert.yaml#/components/schemas/ActiveAlert'
