get:
  summary: List active threshold alerts
  description: |-
    Returns real-time alerts evaluated from stream processing.

    Query conventions ([QUERY_CONVENTIONS.md](../../../../docs/07-api/QUERY_CONVENTIONS.md)):
    filterable fields — `severity` (eq, ne, IN), `assetId` (eq, ne), `metricName`
    (eq, ne, like), `triggeredAt` (gt, gte, lt, lte), `value` / `threshold`
    (eq, ne, gt, gte, lt, lte); `q` is a case-insensitive substring search over
    `message` only; sortable — `triggeredAt, severity, metricName`
    (default `-triggeredAt`); selectable — `id, physicalAssetId, metricName,
    severity, message, triggeredAt, value, threshold`.
    Violations are INVALID_FILTER_FIELD / INVALID_FILTER_OPERATOR /
    INVALID_SORT_FIELD / INVALID_FIELD_SELECTION (400).
  operationId: getActiveAlerts
  tags:
    - Alerts
  parameters:
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Page'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Limit'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Cursor'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Sort'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Q'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Fields'
    - name: severity
      in: query
      description: Filter by alert severity level; comma-separated for multiple levels
      required: false
      schema:
        type: string
        enum: [INFO, WARNING, CRITICAL]
    - name: severity[ne]
      in: query
      description: Exclude this alert severity level
      required: false
      style: form
      explode: true
      schema:
        type: string
        enum: [INFO, WARNING, CRITICAL]
    - name: assetId
      in: query
      description: UUID of the physical asset
      required: false
      schema:
        type: string
        format: uuid
        example: 0194eb82-8234-789a-bcde-0123456789ab
    - name: assetId[ne]
      in: query
      description: Exclude alerts from this physical asset
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: uuid
    - name: metricName
      in: query
      description: Sensor metric name; comma-separated for multiple metrics
      required: false
      schema:
        type: string
        example: motor_torque_nm
    - name: metricName[ne]
      in: query
      description: Exclude this sensor metric name
      required: false
      style: form
      explode: true
      schema:
        type: string
    - name: metricName[like]
      in: query
      description: Case-insensitive substring match on the sensor metric name
      required: false
      style: form
      explode: true
      schema:
        type: string
    - name: triggeredAt[gt]
      in: query
      description: Trigger timestamp strictly after (exclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: triggeredAt[gte]
      in: query
      description: Trigger timestamp at or after (inclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: triggeredAt[lt]
      in: query
      description: Trigger timestamp strictly before (exclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: triggeredAt[lte]
      in: query
      description: Trigger timestamp at or before (inclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: value
      in: query
      description: Exact observed reading value
      required: false
      schema:
        type: number
        format: double
    - name: value[ne]
      in: query
      description: Exclude this exact observed reading value
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[gt]
      in: query
      description: Observed value strictly greater than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[gte]
      in: query
      description: Observed value greater than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[lt]
      in: query
      description: Observed value strictly less than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[lte]
      in: query
      description: Observed value less than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: threshold
      in: query
      description: Exact breached threshold value
      required: false
      schema:
        type: number
        format: double
    - name: threshold[ne]
      in: query
      description: Exclude this exact threshold value
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: threshold[gt]
      in: query
      description: Threshold strictly greater than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: threshold[gte]
      in: query
      description: Threshold greater than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: threshold[lt]
      in: query
      description: Threshold strictly less than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: threshold[lte]
      in: query
      description: Threshold less than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
  responses:
    '200':
      description: Active alerts list
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: '../schemas/alert.yaml#/components/schemas/ActiveAlert'
              meta:
                type: object
                required:
                  - page
                  - limit
                  - total
                  - totalPages
                properties:
                  page:
                    type: integer
                    minimum: 0
                    example: 0
                  limit:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    minimum: 0
                    example: 2
                  totalPages:
                    type: integer
                    minimum: 0
                    example: 1
    '400':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/BadRequestError'
    '401':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ForbiddenError'
    '429':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ServiceUnavailableError'
