get:
  summary: Get latest sensor readings for assets
  description: |-
    Retrieve the most recent sensor readings across all machines or filtered by asset ID.

    Query conventions ([QUERY_CONVENTIONS.md](../../../../docs/07-api/QUERY_CONVENTIONS.md)):
    filterable fields — `assetId` (eq, ne, IN), `metricName` (eq, ne, like),
    `value` (eq, ne, gt, gte, lt, lte), `time` (gt, gte, lt, lte), `quality`
    (eq, ne, IN); sortable — `time, value, metricName` (default `-time`);
    selectable — `time, physicalAssetId, metricName, value, quality`.
    Violations are INVALID_FILTER_FIELD / INVALID_FILTER_OPERATOR /
    INVALID_SORT_FIELD / INVALID_FIELD_SELECTION (400).
  operationId: getLatestTelemetry
  tags:
    - Telemetry
  parameters:
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Page'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Limit'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Cursor'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Sort'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Fields'
    - name: assetId
      in: query
      description: Optional UUID of the physical asset; comma-separated for multiple assets
      required: false
      schema:
        type: string
        example: 0194eb82-8234-789a-bcde-0123456789ab
    - name: assetId[ne]
      in: query
      description: Exclude readings from this physical asset
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: uuid
    - name: metricName
      in: query
      description: Sensor metric name; comma-separated for multiple metrics
      required: false
      schema:
        type: string
        example: temperature_celsius
    - name: metricName[ne]
      in: query
      description: Exclude this sensor metric name
      required: false
      style: form
      explode: true
      schema:
        type: string
    - name: metricName[like]
      in: query
      description: Case-insensitive substring match on the sensor metric name
      required: false
      style: form
      explode: true
      schema:
        type: string
    - name: value
      in: query
      description: Exact reading value
      required: false
      schema:
        type: number
        format: double
    - name: value[ne]
      in: query
      description: Exclude this exact reading value
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[gt]
      in: query
      description: Reading value strictly greater than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[gte]
      in: query
      description: Reading value greater than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[lt]
      in: query
      description: Reading value strictly less than
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: value[lte]
      in: query
      description: Reading value less than or equal
      required: false
      style: form
      explode: true
      schema:
        type: number
        format: double
    - name: time[gt]
      in: query
      description: Reading timestamp strictly after (exclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: time[gte]
      in: query
      description: Reading timestamp at or after (inclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: time[lt]
      in: query
      description: Reading timestamp strictly before (exclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: time[lte]
      in: query
      description: Reading timestamp at or before (inclusive)
      required: false
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: quality
      in: query
      description: Sensor quality flag; comma-separated for multiple values
      required: false
      schema:
        type: string
        enum: [GOOD, BAD, UNCERTAIN]
    - name: quality[ne]
      in: query
      description: Exclude this sensor quality flag
      required: false
      style: form
      explode: true
      schema:
        type: string
        enum: [GOOD, BAD, UNCERTAIN]
  responses:
    '200':
      description: Latest telemetry readings retrieved successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                type: array
                items:
                  $ref: '../schemas/telemetry.yaml#/components/schemas/TelemetryReading'
              meta:
                type: object
                required:
                  - page
                  - limit
                  - total
                properties:
                  page:
                    type: integer
                    minimum: 0
                    example: 0
                  limit:
                    type: integer
                    example: 20
                  total:
                    type: integer
                    minimum: 0
                    example: 2
    '400':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/BadRequestError'
    '401':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ForbiddenError'
    '429':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ServiceUnavailableError'
