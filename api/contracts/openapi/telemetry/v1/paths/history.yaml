get:
  summary: Query time-bucketed historical aggregate telemetry
  description: |-
    Returns rolled-up aggregates (AVG, MIN, MAX, COUNT) from TimescaleDB continuous aggregates.

    This is a bounded aggregate query, not an open collection: it carries no
    pagination params. Instead the time-range/bucket combination is capped —
    more than ~10,000 buckets is BUCKET_COUNT_OUT_OF_RANGE (400); widen `bucket`.

    Query conventions ([QUERY_CONVENTIONS.md](../../../../docs/07-api/QUERY_CONVENTIONS.md)):
    sortable — `bucketTime` only (default ascending, `-bucketTime` for descending);
    selectable — `bucketTime, avgValue, minValue, maxValue, sampleCount`
    (projects `buckets[]` entries). Violations are INVALID_SORT_FIELD /
    INVALID_FIELD_SELECTION (400).
  operationId: getHistoricalTelemetry
  tags:
    - Analytics
  parameters:
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Sort'
    - $ref: '../../../common/v1/parameters/query.yaml#/components/parameters/Fields'
    - name: assetId
      in: query
      required: true
      description: UUID of the physical asset
      schema:
        type: string
        format: uuid
        example: 0194eb82-8234-789a-bcde-0123456789ab
    - name: metricName
      in: query
      required: true
      description: Sensor metric name
      schema:
        type: string
        example: temperature_celsius
    - name: from
      in: query
      required: true
      description: Inclusive start ISO-8601 timestamp; must be earlier than `to`
      schema:
        type: string
        format: date-time
        example: '2026-08-10T00:00:00Z'
    - name: to
      in: query
      required: true
      description: Exclusive end ISO-8601 timestamp; must be later than `from`
      schema:
        type: string
        format: date-time
        example: '2026-08-11T00:00:00Z'
    - name: bucket
      in: query
      description: Aggregation bucket window (e.g. 1m, 5m, 1h, 1d)
      required: false
      schema:
        type: string
        default: 1h
        example: 1h
  responses:
    '200':
      description: Historical aggregates retrieved successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - assetId
              - metricName
              - buckets
            properties:
              assetId:
                type: string
                format: uuid
              metricName:
                type: string
              buckets:
                type: array
                items:
                  $ref: '../schemas/aggregate.yaml#/components/schemas/TelemetryAggregateBucket'
    '400':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/BadRequestError'
    '401':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ForbiddenError'
    '429':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/InternalServerError'
    '503':
      $ref: '../../../common/v1/responses/errors.yaml#/components/responses/ServiceUnavailableError'
