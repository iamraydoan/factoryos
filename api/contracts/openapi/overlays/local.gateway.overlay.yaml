overlay: 1.0.0
info:
  title: FactoryOS Telemetry Local Gateway Overlay
  version: 1.0.0
  description: |
    Dev-only local gateway view for Swagger UI. Never used for oapi-codegen.
    Applies the local Traefik host, the Zitadel openIdConnect scheme, and
    per-operation scopes on top of the pure auth-free bundled contract.
actions:
  - target: $.servers[0]
    update:
      url: http://localhost/api/v1
      description: Local Traefik API gateway
  - target: $.components
    update:
      securitySchemes:
        zitadel:
          type: openIdConnect
          openIdConnectUrl: http://localhost:8081/.well-known/openid-configuration
          description: |
            Canonical FactoryOS REST identity scheme. Local gateway overlay only.
            Clients send the issued access token as an HTTP Bearer token.
  - target: $.paths['/stats'].get
    update:
      security:
        - zitadel: [ops.read]
  - target: $.paths['/telemetry/latest'].get
    update:
      security:
        - zitadel: [telemetry.read]
  - target: $.paths['/telemetry/history'].get
    update:
      security:
        - zitadel: [telemetry.read]
  - target: $.paths['/telemetry/alerts'].get
    update:
      security:
        - zitadel: [alerts.read]
