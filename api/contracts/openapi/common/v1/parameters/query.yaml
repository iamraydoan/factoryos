components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number, 1-indexed on the wire — ?page=1 is the first page (page-based pagination only)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from the previous response (cursor-based pagination only)
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated sort fields; a `-` prefix means descending
        (e.g. `-triggeredAt,severity`). Each endpoint declares its sortable-field
        allowlist and default; unknown fields are INVALID_SORT_FIELD (400).
      style: form
      explode: false
      schema:
        type: string
        example: '-triggeredAt,severity'
    Q:
      name: q
      in: query
      required: false
      description: >-
        Free-text search, matched as a case-insensitive substring against the
        endpoint's declared searchable fields. Combines with AND alongside filters.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Fields:
      name: fields
      in: query
      required: false
      description: >-
        Sparse fieldset — comma-separated resource properties to return.
        Each endpoint declares its selectable-field allowlist; unknown fields
        are INVALID_FIELD_SELECTION (400).
      style: form
      explode: false
      schema:
        type: string
        example: 'id,message,triggeredAt'
