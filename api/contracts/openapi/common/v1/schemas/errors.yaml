components:
  schemas:
    # ------------------------------------------------------------------
    # RFC 9457 Problem Details + FactoryOS extension members.
    # (RFC 9457 obsoletes RFC 7807 and is backward compatible.)
    #
    # `code` is the machine-readable contract. `type` is derived
    # deterministically from `code`: https://factoryos.dev/errors/<kebab-case-code>.
    # Clients SHOULD branch on `code`; `type` exists for documentation links.
    #
    # Defined in ADR-0007. Full taxonomy and mapping rules:
    # docs/07-api/ERROR_HANDLING.md
    # ------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          example: https://factoryos.dev/errors/work-order-invalid-transition
          description: |
            Stable URI identifying the problem type. Derived from `code`, so it
            can never disagree with the code it identifies.
        title:
          type: string
          example: Invalid state transition
          description: Short human-readable summary. Constant for every instance of this code.
        status:
          type: integer
          format: int32
          example: 409
          description: HTTP status code.
        detail:
          type: string
          example: "Work order cannot go from 'closed' to 'released'."
          description: Human-readable explanation of THIS occurrence.
        instance:
          type: string
          format: uri-reference
          example: /api/v1/work-orders/0192f3a1-7c4e-7b2a-9f01-3d5e8a1b2c34
          description: Request path that produced the problem.
        code:
          type: string
          example: WORK_ORDER_INVALID_TRANSITION
          description: |
            Machine-readable error code. Convention: <DOMAIN>_<REASON>, uppercase,
            underscore-separated. The full taxonomy is defined in the Java enums
            (CommonErrorCode, WorkOrderErrorCode, ...) and documented in
            docs/07-api/ERROR_HANDLING.md.
        retryable:
          type: boolean
          example: false
          description: |
            Whether the caller may retry the identical request. A 503 is
            retryable; a state-machine conflict is not. Stated explicitly rather
            than inferred from `status`, because ABORTED-style retries are a
            deliberate decision, not a consequence of the status code.
        traceId:
          type: string
          example: 4f2a9c1e-8b7d-4a3f-9e21-6c5b8d0a7f13
          description: Correlation id for support escalation. Present on 5xx responses.
        timestamp:
          type: string
          format: date-time
          example: '2026-09-14T08:30:00Z'
        errors:
          type: array
          description: Field-level detail, when a single message is not enough.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          example: state
          description: |
            The offending field. Use the constants in com.factoryos.common.error.ErrorKey
            so client and server cannot disagree on spelling.
        code:
          type: string
          example: INVALID_TRANSITION
        message:
          type: string
          example: closed cannot transition to released
        current:
          type: string
          example: closed
          description: The value observed. Present for state and conflict errors.
        allowed:
          type: array
          items:
            type: string
          example: [released]
          description: Valid alternatives, when they are enumerable.
