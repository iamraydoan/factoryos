syntax = "proto3";

package resource.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/iamraydoan/factoryos/api/contracts/resource/v1";

// ----------------------------------------------------------------------------
// Entity Models (ISA-95 Equipment Hierarchy)
// ----------------------------------------------------------------------------

message Site {
  string id = 1;              // UUIDv7
  string name = 2;            // e.g., "Austin Gigafactory"
  string location = 3;        // Physical address or region
  google.protobuf.Timestamp created_at = 4;
}

message Area {
  string id = 1;              // UUIDv7
  string site_id = 2;         // Foreign key to Site
  string name = 3;            // e.g., "Stamping Area"
  google.protobuf.Timestamp created_at = 4;
}

message WorkCenter {
  string id = 1;              // UUIDv7
  string area_id = 2;         // Foreign key to Area
  string name = 3;            // e.g., "Press Line 1"
  string equipment_class = 4; // Capability spec (e.g., "Heavy Press")
  google.protobuf.Timestamp created_at = 5;
}

enum WorkUnitStatus {
  WORK_UNIT_STATUS_UNSPECIFIED = 0;
  WORK_UNIT_STATUS_AVAILABLE = 1;
  WORK_UNIT_STATUS_ALLOCATED = 2;
  WORK_UNIT_STATUS_IN_PRODUCTION = 3;
  WORK_UNIT_STATUS_FAULTED = 4;
}

message WorkUnit {
  string id = 1;              // UUIDv7
  string work_center_id = 2;  // Foreign key to WorkCenter
  string name = 3;            // e.g., "Press Station 1A"
  WorkUnitStatus status = 4;  // Current operational status
  string physical_asset_id = 5; // Optional: Link to Physical Asset currently installed
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message EquipmentClass {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message WorkUnitCapability {
  string id = 1;
  string work_unit_id = 2;
  string equipment_class_id = 3;
  string properties_json = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ----------------------------------------------------------------------------
// gRPC Service & Request/Response Models
// ----------------------------------------------------------------------------

service EquipmentService {
  // Work Unit API
  rpc CreateWorkUnit(CreateWorkUnitRequest) returns (CreateWorkUnitResponse);
  rpc GetWorkUnit(GetWorkUnitRequest) returns (GetWorkUnitResponse);
  rpc ListWorkUnits(ListWorkUnitsRequest) returns (ListWorkUnitsResponse);
  rpc UpdateWorkUnitStatus(UpdateWorkUnitStatusRequest) returns (UpdateWorkUnitStatusResponse);

  // Equipment Class API
  rpc CreateEquipmentClass(CreateEquipmentClassRequest) returns (CreateEquipmentClassResponse);
  rpc GetEquipmentClass(GetEquipmentClassRequest) returns (GetEquipmentClassResponse);
  rpc ListEquipmentClasses(ListEquipmentClassesRequest) returns (ListEquipmentClassesResponse);

  // Capability Assignment API
  rpc AssignCapability(AssignCapabilityRequest) returns (AssignCapabilityResponse);
  rpc ListWorkUnitCapabilities(ListWorkUnitCapabilitiesRequest) returns (ListWorkUnitCapabilitiesResponse);
  rpc RemoveCapability(RemoveCapabilityRequest) returns (RemoveCapabilityResponse);
}

message CreateWorkUnitRequest {
  string work_center_id = 1;
  string name = 2;
}

message CreateWorkUnitResponse {
  WorkUnit work_unit = 1;
}

message GetWorkUnitRequest {
  string id = 1;
}

message GetWorkUnitResponse {
  WorkUnit work_unit = 1;
}

message ListWorkUnitsRequest {
  string work_center_id = 1; // Filter by Work Center
}

message ListWorkUnitsResponse {
  repeated WorkUnit work_units = 1;
}

message UpdateWorkUnitStatusRequest {
  string id = 1;
  WorkUnitStatus status = 2;
}

message UpdateWorkUnitStatusResponse {
  WorkUnit work_unit = 1;
}

message CreateEquipmentClassRequest {
  string name = 1;
  string description = 2;
}

message CreateEquipmentClassResponse {
  EquipmentClass equipment_class = 1;
}

message GetEquipmentClassRequest {
  string id = 1;
}

message GetEquipmentClassResponse {
  EquipmentClass equipment_class = 1;
}

message ListEquipmentClassesRequest {}

message ListEquipmentClassesResponse {
  repeated EquipmentClass equipment_classes = 1;
}

// Capability Assignment messages
message AssignCapabilityRequest {
  string work_unit_id = 1;
  string equipment_class_id = 2;
  string properties_json = 3;
}

message AssignCapabilityResponse {
  WorkUnitCapability capability = 1;
}

message ListWorkUnitCapabilitiesRequest {
  string work_unit_id = 1;
}

message ListWorkUnitCapabilitiesResponse {
  repeated WorkUnitCapability capabilities = 1;
}

message RemoveCapabilityRequest {
  string work_unit_id = 1;
  string equipment_class_id = 2;
}

message RemoveCapabilityResponse {
  bool removed = 1;
}
