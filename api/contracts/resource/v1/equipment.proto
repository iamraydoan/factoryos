syntax = "proto3";

package resource.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/iamraydoan/factoryos/api/contracts/resource/v1";

// ----------------------------------------------------------------------------
// Entity Models (ISA-95 Equipment Hierarchy & Personnel)
// ----------------------------------------------------------------------------

message Site {
  string id = 1;              // UUIDv7
  string name = 2;            // e.g., "Austin Gigafactory"
  string location = 3;        // Physical address or region
  google.protobuf.Timestamp created_at = 4;
}

message Area {
  string id = 1;              // UUIDv7
  string site_id = 2;         // Foreign key to Site
  string name = 3;            // e.g., "Stamping Area"
  google.protobuf.Timestamp created_at = 4;
}

message WorkCenter {
  string id = 1;              // UUIDv7
  string area_id = 2;         // Foreign key to Area
  string name = 3;            // e.g., "Press Line 1"
  string equipment_class = 4; // Capability spec (e.g., "Heavy Press")
  google.protobuf.Timestamp created_at = 5;
}

enum WorkUnitStatus {
  WORK_UNIT_STATUS_UNSPECIFIED = 0;
  WORK_UNIT_STATUS_AVAILABLE = 1;
  WORK_UNIT_STATUS_ALLOCATED = 2;
  WORK_UNIT_STATUS_IN_PRODUCTION = 3;
  WORK_UNIT_STATUS_FAULTED = 4;
}

message WorkUnit {
  string id = 1;              // UUIDv7
  string work_center_id = 2;  // Foreign key to WorkCenter
  string name = 3;            // e.g., "Press Station 1A"
  WorkUnitStatus status = 4;  // Current operational status
  string physical_asset_id = 5; // Optional: Link to Physical Asset currently installed
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message EquipmentClass {
  string id = 1;              // UUIDv7
  string name = 2;            // e.g., "CNC Lathe ≥ 5-axis"
  string description = 3;     // Capability specification
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message WorkUnitCapability {
  string id = 1;              // UUIDv7
  string work_unit_id = 2;    // Foreign key to WorkUnit
  string equipment_class_id = 3; // Foreign key to EquipmentClass
  string properties_json = 4; // JSON key-value properties
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Physical Asset: a real machine with a serial number.
message PhysicalAsset {
  string id = 1;                    // UUIDv7
  string name = 2;                  // Human-readable name (e.g., "Haas VF-2")
  string serial_number = 3;         // Manufacturer serial number
  string manufacturer = 4;          // e.g., "Haas Automation"
  string model = 5;                 // e.g., "VF-2"
  string asset_type = 6;            // e.g., "CNC Mill", "Press", "Robot"
  PhysicalAssetStatus status = 7;   // Current operational status
  google.protobuf.Timestamp installed_at = 8;  // When current install began (nullable)
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum PhysicalAssetStatus {
  PHYSICAL_ASSET_STATUS_UNSPECIFIED = 0;
  PHYSICAL_ASSET_STATUS_ACTIVE = 1;
  PHYSICAL_ASSET_STATUS_FAULTED = 2;
  PHYSICAL_ASSET_STATUS_UNDER_MAINTENANCE = 3;
  PHYSICAL_ASSET_STATUS_DECOMMISSIONED = 4;
}

// Physical Asset Installation: time-bounded link between asset and work unit.
message PhysicalAssetInstallation {
  string id = 1;
  string physical_asset_id = 2;
  string work_unit_id = 3;
  google.protobuf.Timestamp installed_at = 4;
  google.protobuf.Timestamp removed_at = 5;   // NULL = currently installed
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// PersonClass: a role category (e.g., "Operator", "Technician").
message PersonClass {
  string id = 1;              // UUIDv7
  string name = 2;            // e.g., "Operator", "Technician", "Quality Manager"
  string description = 3;     // Role description
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

enum PersonStatus {
  PERSON_STATUS_UNSPECIFIED = 0;
  PERSON_STATUS_ACTIVE = 1;
  PERSON_STATUS_INACTIVE = 2;
  PERSON_STATUS_ON_LEAVE = 3;
}

// Person: an employee who can be assigned to work units.
message Person {
  string id = 1;              // UUIDv7
  string person_class_id = 2; // Foreign key to PersonClass
  string employee_id = 3;     // Company employee ID (e.g., "EMP-0042")
  string first_name = 4;      // Given name
  string last_name = 5;       // Family name
  string email = 6;           // Work email (nullable)
  PersonStatus status = 7;    // Current employment status
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// QualificationRecord: certifies a Person for a PersonClass at a Work Center.
message QualificationRecord {
  string id = 1;                  // UUIDv7
  string person_id = 2;           // Foreign key to Person
  string person_class_id = 3;     // Foreign key to PersonClass (the role being certified)
  string work_center_id = 4;      // Foreign key to Work Center
  google.protobuf.Timestamp certified_at = 5;  // When certification was granted
  google.protobuf.Timestamp expires_at = 6;    // NULL = no expiry (permanent certification)
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Shift defines a named work shift with start and end times.
message Shift {
  string id = 1;                  // UUIDv7
  string name = 2;                // e.g., "Day Shift", "Night Shift A"
  string start_time = 3;          // "HH:MM" in 24h format (e.g., "06:00")
  string end_time = 4;            // "HH:MM" in 24h format (e.g., "14:00")
  string description = 5;         // Optional description
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ShiftAssignment links a Person to a Shift at a Work Center.
message ShiftAssignment {
  string id = 1;                  // UUIDv7
  string person_id = 2;           // Foreign key to Person
  string shift_id = 3;            // Foreign key to Shift
  string work_center_id = 4;      // Foreign key to Work Center
  google.protobuf.Timestamp effective_from = 5;  // When assignment starts
  google.protobuf.Timestamp effective_to = 6;    // NULL = open-ended (current assignment)
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// MaterialClass: a category of material (e.g., "Raw Material", "Sub-Assembly", "Finished Good").
message MaterialClass {
  string id = 1;                  // UUIDv7
  string name = 2;                // e.g., "Raw Material", "Finished Good"
  string description = 3;         // Category description
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// MaterialDefinition: a specific material or product with its specification.
message MaterialDefinition {
  string id = 1;                  // UUIDv7
  string material_class_id = 2;   // Foreign key to MaterialClass
  string name = 3;                // e.g., "Aluminum Sheet 3mm", "Engine Block Assembly"
  string part_number = 4;         // Unique part number (e.g., "MAT-AL-3MM")
  string unit_of_measure = 5;     // e.g., "kg", "pcs", "liters", "meters"
  string specification = 6;       // Optional JSON spec (grade, tolerance, etc.)
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ----------------------------------------------------------------------------
// gRPC Service & Request/Response Models
// ----------------------------------------------------------------------------

service EquipmentService {
  // Work Unit API
  rpc CreateWorkUnit(CreateWorkUnitRequest) returns (CreateWorkUnitResponse);
  rpc GetWorkUnit(GetWorkUnitRequest) returns (GetWorkUnitResponse);
  rpc ListWorkUnits(ListWorkUnitsRequest) returns (ListWorkUnitsResponse);
  rpc UpdateWorkUnitStatus(UpdateWorkUnitStatusRequest) returns (UpdateWorkUnitStatusResponse);

  // Equipment Class API
  rpc CreateEquipmentClass(CreateEquipmentClassRequest) returns (CreateEquipmentClassResponse);
  rpc GetEquipmentClass(GetEquipmentClassRequest) returns (GetEquipmentClassResponse);
  rpc ListEquipmentClasses(ListEquipmentClassesRequest) returns (ListEquipmentClassesResponse);

  // Capability Assignment API
  rpc AssignCapability(AssignCapabilityRequest) returns (AssignCapabilityResponse);
  rpc ListWorkUnitCapabilities(ListWorkUnitCapabilitiesRequest) returns (ListWorkUnitCapabilitiesResponse);
  rpc RemoveCapability(RemoveCapabilityRequest) returns (RemoveCapabilityResponse);

  // Physical Asset API
  rpc CreatePhysicalAsset(CreatePhysicalAssetRequest) returns (CreatePhysicalAssetResponse);
  rpc GetPhysicalAsset(GetPhysicalAssetRequest) returns (GetPhysicalAssetResponse);
  rpc ListPhysicalAssets(ListPhysicalAssetsRequest) returns (ListPhysicalAssetsResponse);

  // Installation API
  rpc InstallAsset(InstallAssetRequest) returns (InstallAssetResponse);
  rpc UninstallAsset(UninstallAssetRequest) returns (UninstallAssetResponse);
  rpc GetCurrentInstallation(GetCurrentInstallationRequest) returns (GetCurrentInstallationResponse);
  rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse);

  // Person Class API
  rpc CreatePersonClass(CreatePersonClassRequest) returns (CreatePersonClassResponse);
  rpc GetPersonClass(GetPersonClassRequest) returns (GetPersonClassResponse);
  rpc ListPersonClasses(ListPersonClassesRequest) returns (ListPersonClassesResponse);

  // Person API
  rpc CreatePerson(CreatePersonRequest) returns (CreatePersonResponse);
  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse);
  rpc ListPersons(ListPersonsRequest) returns (ListPersonsResponse);

  // Qualification Record API
  rpc QualifyPerson(QualifyPersonRequest) returns (QualifyPersonResponse);
  rpc GetQualification(GetQualificationRequest) returns (GetQualificationResponse);
  rpc ListQualifications(ListQualificationsRequest) returns (ListQualificationsResponse);
  rpc RevokeQualification(RevokeQualificationRequest) returns (RevokeQualificationResponse);
  rpc CheckExpiringQualifications(CheckExpiringQualificationsRequest) returns (CheckExpiringQualificationsResponse);

  // Shift API
  rpc CreateShift(CreateShiftRequest) returns (CreateShiftResponse);
  rpc GetShift(GetShiftRequest) returns (GetShiftResponse);
  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse);

  // Shift Assignment API
  rpc AssignShift(AssignShiftRequest) returns (AssignShiftResponse);
  rpc GetShiftAssignment(GetShiftAssignmentRequest) returns (GetShiftAssignmentResponse);
  rpc ListShiftAssignments(ListShiftAssignmentsRequest) returns (ListShiftAssignmentsResponse);
  rpc UnassignShift(UnassignShiftRequest) returns (UnassignShiftResponse);

  // Material Class API
  rpc CreateMaterialClass(CreateMaterialClassRequest) returns (CreateMaterialClassResponse);
  rpc GetMaterialClass(GetMaterialClassRequest) returns (GetMaterialClassResponse);
  rpc ListMaterialClasses(ListMaterialClassesRequest) returns (ListMaterialClassesResponse);

  // Material Definition API
  rpc CreateMaterialDefinition(CreateMaterialDefinitionRequest) returns (CreateMaterialDefinitionResponse);
  rpc GetMaterialDefinition(GetMaterialDefinitionRequest) returns (GetMaterialDefinitionResponse);
  rpc ListMaterialDefinitions(ListMaterialDefinitionsRequest) returns (ListMaterialDefinitionsResponse);
}

// --- Work Unit messages ---

message CreateWorkUnitRequest {
  string work_center_id = 1;
  string name = 2;
}

message CreateWorkUnitResponse {
  WorkUnit work_unit = 1;
}

message GetWorkUnitRequest {
  string id = 1;
}

message GetWorkUnitResponse {
  WorkUnit work_unit = 1;
}

message ListWorkUnitsRequest {
  string work_center_id = 1; // Filter by Work Center
}

message ListWorkUnitsResponse {
  repeated WorkUnit work_units = 1;
}

message UpdateWorkUnitStatusRequest {
  string id = 1;
  WorkUnitStatus status = 2;
}

message UpdateWorkUnitStatusResponse {
  WorkUnit work_unit = 1;
}

// --- Equipment Class messages ---

message CreateEquipmentClassRequest {
  string name = 1;
  string description = 2;
}

message CreateEquipmentClassResponse {
  EquipmentClass equipment_class = 1;
}

message GetEquipmentClassRequest {
  string id = 1;
}

message GetEquipmentClassResponse {
  EquipmentClass equipment_class = 1;
}

message ListEquipmentClassesRequest {}

message ListEquipmentClassesResponse {
  repeated EquipmentClass equipment_classes = 1;
}

// --- Capability Assignment messages ---

message AssignCapabilityRequest {
  string work_unit_id = 1;
  string equipment_class_id = 2;
  string properties_json = 3;
}

message AssignCapabilityResponse {
  WorkUnitCapability capability = 1;
}

message ListWorkUnitCapabilitiesRequest {
  string work_unit_id = 1;
}

message ListWorkUnitCapabilitiesResponse {
  repeated WorkUnitCapability capabilities = 1;
}

message RemoveCapabilityRequest {
  string work_unit_id = 1;
  string equipment_class_id = 2;
}

message RemoveCapabilityResponse {
  bool removed = 1;
}

// --- Physical Asset messages ---

message CreatePhysicalAssetRequest {
  string name = 1;
  string serial_number = 2;
  string manufacturer = 3;
  string model = 4;
  string asset_type = 5;
}

message CreatePhysicalAssetResponse {
  PhysicalAsset physical_asset = 1;
}

message GetPhysicalAssetRequest {
  string id = 1;
}

message GetPhysicalAssetResponse {
  PhysicalAsset physical_asset = 1;
}

message ListPhysicalAssetsRequest {}

message ListPhysicalAssetsResponse {
  repeated PhysicalAsset physical_assets = 1;
}

// --- Installation messages ---

message InstallAssetRequest {
  string physical_asset_id = 1;
  string work_unit_id = 2;
}

message InstallAssetResponse {
  PhysicalAssetInstallation installation = 1;
}

message UninstallAssetRequest {
  string work_unit_id = 1;
}

message UninstallAssetResponse {
  PhysicalAssetInstallation installation = 1;
}

message GetCurrentInstallationRequest {
  string work_unit_id = 1;
}

message GetCurrentInstallationResponse {
  PhysicalAssetInstallation installation = 1;
}

message ListInstallationsRequest {
  string work_unit_id = 1;
}

message ListInstallationsResponse {
  repeated PhysicalAssetInstallation installations = 1;
}

// --- Person Class messages ---

message CreatePersonClassRequest {
  string name = 1;
  string description = 2;
}

message CreatePersonClassResponse {
  PersonClass person_class = 1;
}

message GetPersonClassRequest {
  string id = 1;
}

message GetPersonClassResponse {
  PersonClass person_class = 1;
}

message ListPersonClassesRequest {}

message ListPersonClassesResponse {
  repeated PersonClass person_classes = 1;
}

// --- Person messages ---

message CreatePersonRequest {
  string person_class_id = 1;
  string employee_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
}

message CreatePersonResponse {
  Person person = 1;
}

message GetPersonRequest {
  string id = 1;
}

message GetPersonResponse {
  Person person = 1;
}

message ListPersonsRequest {
  string person_class_id = 1; // Filter by PersonClass (empty = all)
}

message ListPersonsResponse {
  repeated Person persons = 1;
}

// --- Qualification Record messages ---

message QualifyPersonRequest {
  string person_id = 1;
  string person_class_id = 2;     // Which role is being certified
  string work_center_id = 3;      // At which Work Center
  string expires_at = 4;          // ISO 8601 datetime (empty = no expiry)
}

message QualifyPersonResponse {
  QualificationRecord qualification = 1;
}

message GetQualificationRequest {
  string id = 1;
}

message GetQualificationResponse {
  QualificationRecord qualification = 1;
}

message ListQualificationsRequest {
  string person_id = 1;           // Filter by Person (empty = all)
  string work_center_id = 2;      // Filter by Work Center (empty = all)
}

message ListQualificationsResponse {
  repeated QualificationRecord qualifications = 1;
}

message RevokeQualificationRequest {
  string id = 1;                  // QualificationRecord ID to revoke
}

message RevokeQualificationResponse {
  bool revoked = 1;
}

message CheckExpiringQualificationsRequest {
  string before = 1;  // RFC3339 timestamp (e.g., "2026-09-20T00:00:00Z")
}

message CheckExpiringQualificationsResponse {
  repeated QualificationRecord qualifications = 1;
}

// --- Shift messages ---

message CreateShiftRequest {
  string name = 1;
  string start_time = 2;          // "HH:MM" (e.g., "06:00")
  string end_time = 3;            // "HH:MM" (e.g., "14:00")
  string description = 4;
}

message CreateShiftResponse {
  Shift shift = 1;
}

message GetShiftRequest {
  string id = 1;
}

message GetShiftResponse {
  Shift shift = 1;
}

message ListShiftsRequest {}

message ListShiftsResponse {
  repeated Shift shifts = 1;
}

// --- Shift Assignment messages ---

message AssignShiftRequest {
  string person_id = 1;
  string shift_id = 2;
  string work_center_id = 3;
  string effective_from = 4;      // RFC3339 timestamp (e.g., "2026-08-21T00:00:00Z")
}

message AssignShiftResponse {
  ShiftAssignment assignment = 1;
}

message GetShiftAssignmentRequest {
  string id = 1;
}

message GetShiftAssignmentResponse {
  ShiftAssignment assignment = 1;
}

message ListShiftAssignmentsRequest {
  string person_id = 1;           // Filter by Person (empty = all)
  string shift_id = 2;            // Filter by Shift (empty = all)
  string work_center_id = 3;      // Filter by Work Center (empty = all)
}

message ListShiftAssignmentsResponse {
  repeated ShiftAssignment assignments = 1;
}

message UnassignShiftRequest {
  string id = 1;                  // ShiftAssignment ID to remove
}

message UnassignShiftResponse {
  bool unassigned = 1;
}

// --- Material Class messages ---

message CreateMaterialClassRequest {
  string name = 1;                // Required: unique class name
  string description = 2;         // Optional: category description
}

message CreateMaterialClassResponse {
  MaterialClass material_class = 1;
}

message GetMaterialClassRequest {
  string id = 1;                  // MaterialClass UUID
}

message GetMaterialClassResponse {
  MaterialClass material_class = 1;
}

message ListMaterialClassesRequest {}

message ListMaterialClassesResponse {
  repeated MaterialClass material_classes = 1;
}

// --- Material Definition messages ---

message CreateMaterialDefinitionRequest {
  string material_class_id = 1;   // Required: FK to MaterialClass
  string name = 2;                // Required: material name
  string part_number = 3;         // Required: unique part number
  string unit_of_measure = 4;     // Required: e.g., "kg", "pcs", "liters"
  string specification = 5;       // Optional: JSON spec (grade, tolerance, etc.)
}

message CreateMaterialDefinitionResponse {
  MaterialDefinition material_definition = 1;
}

message GetMaterialDefinitionRequest {
  string id = 1;                  // MaterialDefinition UUID
}

message GetMaterialDefinitionResponse {
  MaterialDefinition material_definition = 1;
}

message ListMaterialDefinitionsRequest {
  string material_class_id = 1;   // Filter by MaterialClass (empty = all)
}

message ListMaterialDefinitionsResponse {
  repeated MaterialDefinition material_definitions = 1;
}
